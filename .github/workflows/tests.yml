name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['2026.9.7', '2026.9.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund openclaw@${{ matrix.sdk }}
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_helper_lifecycle.py'
  native-core:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Select installed Xcode
        run: python3 .github/scripts/select-xcode.py
      - run: swift --version
      - name: Full isolated native suite
        run: |
          export OPENCLAW_TEAMS_HOME="$RUNNER_TEMP/clawminutes-test-home"
          mkdir -p "$OPENCLAW_TEAMS_HOME"
          swift test --package-path native -j 4
