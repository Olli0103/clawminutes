name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gateway-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['2026.9.7', '2026.9.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund openclaw@${{ matrix.sdk }}
      - run: npm test
  native-core:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2_beta.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path native -j 4 --filter 'MeetingNotesTests|RecordingIdentityTests|AudioRetentionTests|GatewayArchiveTests|MenuPresentationTests|CaptureRecoveryTests|TranscriptionEngineSwitchTests'
